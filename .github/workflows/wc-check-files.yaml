---
name: check-files
on: workflow_call
jobs:
  check-files:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/registry-action/check-files@v0.2.4
