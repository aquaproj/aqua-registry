---
name: test (workflow_call)
on: workflow_call
permissions: {}
env:
  AQUA_LOG_COLOR: always
jobs:
  path-filter:
    # Get changed files to filter jobs
    outputs:
      check-files: ${{steps.changes.outputs.check-files}}
      json-schema: ${{steps.changes.outputs.json-schema}}
      test-docker: ${{steps.changes.outputs.test-docker}}
      pkgs-files_files: ${{steps.changes.outputs.pkgs-files_files}}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          list-files: shell
          filters: |
            check-files:
              - pkgs/**/pkg.yaml
              - pkgs/**/registry.yaml
              - .github/workflows/wc-check-files.yaml
            pkgs-files:
              - added|modified: pkgs/**/pkg.yaml
              - added|modified: pkgs/**/registry.yaml
            json-schema:
              - registry.yaml
              - .github/workflows/wc-json-schema.yaml
            test-docker:
              - docker/*
              - scripts/**
              - .github/workflows/wc-test-docker.yaml

  test-workflow:
    # renovate-config-validator, ghalint, and typos
    uses: suzuki-shunsuke/test-workflow/.github/workflows/test.yaml@0b89b9b4314282810bc944364380568708208eaa # v0.0.2
    with:
      aqua_version: v2.65.2
    permissions:
      contents: read
      pull-requests: read

  check-files:
    uses: ./.github/workflows/wc-check-files.yaml
    needs: path-filter
    if: ${{needs.path-filter.outputs.check-files == 'true'}}
    permissions:
      contents: read

  json-schema:
    uses: ./.github/workflows/wc-json-schema.yaml
    needs: path-filter
    if: ${{needs.path-filter.outputs.json-schema == 'true'}}
    permissions:
      contents: read

  lint:
    if: ${{needs.path-filter.outputs.pkgs-files_files != ''}}
    uses: ./.github/workflows/wc-lint.yaml
    needs: path-filter
    permissions:
      contents: read
    with:
      # registry.yaml whether or not it changed, because the rules about the aliases are
      # about the whole registry: an alias is wrong when another package answers to the
      # same name, and a package's own file says nothing about the rest of them. It is
      # regenerated from the changed files by autofix, so it is the registry this pull
      # request would leave behind.
      files: ${{needs.path-filter.outputs.pkgs-files_files}} registry.yaml

  test-docker:
    uses: ./.github/workflows/wc-test-docker.yaml
    needs: path-filter
    if: ${{needs.path-filter.outputs.test-docker == 'true'}}
    permissions:
      contents: read

  lintnet:
    uses: ./.github/workflows/wc-lintnet.yaml
    permissions:
      contents: read

  test:
    uses: ./.github/workflows/wc-test.yaml
    permissions:
      contents: read
      pull-requests: read
