---
name: lint
on:
  workflow_call:
    inputs:
      files:
        required: true
        type: string
jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
          policy_allow: "true"
      - run: conftest -v
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}
      # The rules are tested before they are trusted. One of them had stopped saying what
      # its test said and nothing noticed, because nothing ran them.
      - run: conftest verify --policy policy
      - run: conftest test --combine ${{ inputs.files }}
