---
name: test-docker
on: workflow_call
jobs:
  test-docker:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
          policy_allow: "true"
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}
      - name: test GitHub Release
        run: argd t suzuki-shunsuke/mkghtag
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}
      # # Stop testing cargo package as this step takes a long time
      # - name: test cargo package
      #   run: argd t bensadeh/tailspin
      #   env:
      #     AQUA_GITHUB_TOKEN: ${{github.token}}
