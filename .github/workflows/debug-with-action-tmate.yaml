---
name: Debug with action-tmate
on:
  workflow_dispatch:
    inputs:
      runs-on:
        required: false
        default: windows-latest
      pr_number:
        required: false
      ref:
        required: false
jobs:
  action-tmate:
    runs-on: ${{inputs.runs-on}}
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{inputs.ref}}
          persist-credentials: false

      - run: gh pr checkout "$PR"
        if: inputs.pr_number != ''
        env:
          GITHUB_TOKEN: ${{github.token}}
          PR: ${{inputs.pr_number}}
      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.1
          policy_allow: "true"
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}

      # The default vim doesn't work well, so we install the latest vim ourselves.
      - uses: rhysd/action-setup-vim@v1.6.1

      - uses: mxschmitt/action-tmate@v3.19
        with:
          limit-access-to-actor: true # SSH Key is required
        env:
          GITHUB_TOKEN: ${{github.token}} # Pass GitHub Token to shell session
