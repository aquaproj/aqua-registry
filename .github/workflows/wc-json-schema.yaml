---
name: json-schema
on: workflow_call
jobs:
  json-schema:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/registry-action/validate-json-schema@v0.2.4
