# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: x-motemen
    repo_name: ghq
    description: Remote repository management made easy
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("< 1.3.0")
        asset: ghq_{{.OS}}_{{.Arch}}.zip
        files:
          - name: ghq
            src: ghq_{{.OS}}_{{.Arch}}/ghq
        supported_envs:
          - amd64
          - darwin
        rosetta2: true
        checksum:
          type: github_release
          asset: SHASUMS
          file_format: regexp
          algorithm: sha1
          pattern:
            checksum: ^(\b[A-Fa-f0-9]{40}\b)
            file: "^\\b[A-Fa-f0-9]{40}\\b\\s+(\\S+)$"
      - version_constraint: semver("< 1.11.1")
        asset: ghq_{{.OS}}_{{.Arch}}.zip
        files:
          - name: ghq
            src: ghq_{{.OS}}_{{.Arch}}/ghq
        checksum:
          type: github_release
          asset: SHASUMS
          file_format: regexp
          algorithm: sha1
          pattern:
            checksum: ^(\b[A-Fa-f0-9]{40}\b)
            file: "^\\b[A-Fa-f0-9]{40}\\b\\s+(\\S+)$"
      - version_constraint: "true"
        asset: ghq_{{.OS}}_{{.Arch}}.zip
        files:
          - name: ghq
            src: ghq_{{.OS}}_{{.Arch}}/ghq
        checksum:
          type: github_release
          asset: SHASUMS
          file_format: regexp
          algorithm: sha1
          pattern:
            checksum: ^(\b[A-Fa-f0-9]{40}\b)
            file: "^\\b[A-Fa-f0-9]{40}\\b\\s+(\\S+)$"
        github_artifact_attestations:
          signer_workflow: x-motemen/ghq/.github/workflows/release-build.yaml
