# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: blacknon
    repo_name: hwatch
    description: "hwatch: alternative watch command with history, diff view, JSONL logging, and change hooks. since 2018"
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version in ["0.1.6", "0.2.1"]
        no_asset: true
      - version_constraint: Version in ["0.2.0", "0.3.0"]
        asset: hwatch_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        files:
          - name: hwatch
            src: hwatch/hwatch
        supported_envs:
          - darwin
      - version_constraint: semver("= 0.1.0")
        asset: hwatch_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        files:
          - name: hwatch
            src: hwatch_{{.Version}}_{{.OS}}_{{.Arch}}/hwatch
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.1.2")
        asset: hwatch_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.1.4")
        asset: hwatch_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        files:
          - name: hwatch
            src: hwatch/hwatch
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.3.13")
        asset: hwatch-{{.Version}}.{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        files:
          - name: hwatch
            src: bin/hwatch
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
        overrides:
          - goos: darwin
            replacements:
              arm64: aarch64
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.3.18")
        asset: hwatch-{{.Version}}.{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: hwatch
            src: bin/hwatch
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-gnu
        overrides:
          - goos: darwin
            replacements:
              arm64: aarch64
          - goos: windows
            format: zip
            files:
              - name: hwatch
                src: target/{{.Arch}}-{{.OS}}/release/hwatch
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.4.1")
        asset: hwatch-{{.Version}}.{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: hwatch
            src: bin/hwatch
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-gnu
        overrides:
          - goos: windows
            format: zip
            files:
              - name: hwatch
                src: target/{{.Arch}}-{{.OS}}/release/hwatch
      - version_constraint: "true"
        asset: hwatch-{{.Version}}.{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: hwatch
            src: bin/hwatch
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            format: zip
            files:
              - name: hwatch
                src: target/{{.Arch}}-{{.OS}}/release/hwatch
