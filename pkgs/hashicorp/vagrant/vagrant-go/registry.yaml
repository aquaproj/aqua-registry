# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: hashicorp/vagrant/vagrant-go
    type: github_release
    repo_owner: hashicorp
    repo_name: vagrant
    description: Vagrant is a tool for building and distributing development environments
    files:
      - name: vagrant
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver(">= 2.4.4")
        error_message: |
          The Go implementation of Vagrant was removed from the main branch and isn't released since v2.4.4.

          https://github.com/hashicorp/vagrant/issues/12819#issuecomment-2738619021
      - version_constraint: "true"
        asset: vagrant-go_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: github_release
          asset: vagrant_{{trimV .Version}}_SHA256SUMS
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
