# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: gopasspw
    repo_name: gopass
    description: The slightly more awesome standard unix password manager for teams
    asset: gopass-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
    format: tar.gz
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.16.1")
        checksum:
          type: github_release
          asset: gopass_{{trimV .Version}}_SHA256SUMS
          algorithm: sha256
        overrides:
          - goos: windows
            format: zip
      - version_constraint: "true"
        checksum:
          type: github_release
          asset: gopass_{{trimV .Version}}_SHA256SUMS
          algorithm: sha256
          cosign:
            bundle:
              type: github_release
              asset: "gopass_{{trimV .Version}}_SHA256SUMS.sigstore.json"
            opts:
              - --certificate-identity
              - https://github.com/gopasspw/gopass/.github/workflows/autorelease.yml@refs/tags/{{.Version}}
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
        overrides:
          - goos: windows
            format: zip
