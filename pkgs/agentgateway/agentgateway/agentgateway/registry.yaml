# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: agentgateway/agentgateway/agentgateway
    type: github_release
    repo_owner: agentgateway
    repo_name: agentgateway
    description: Next Generation Agentic Proxy for AI Agents and MCP servers
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.4.15")
        no_asset: true
      - version_constraint: semver("<= 0.7.6")
        asset: agentgateway-{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux
          - darwin/arm64
      - version_constraint: semver("<= 0.9.0")
        asset: agentgateway-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux
          - darwin/arm64
          - windows/amd64
      - version_constraint: semver("<= 0.12.0")
        asset: agentgateway-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
      - version_constraint: "true"
        asset: agentgateway-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux
          - darwin/arm64
          - windows/amd64
