# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: agentgateway/agentgateway/agentgateway
    type: github_release
    repo_owner: agentgateway
    repo_name: agentgateway
    description: Next Generation Agentic Proxy for AI Agents and MCP servers
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.0.2"
        asset: mcp-gw-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: Version == "v0.0.3"
        asset: mcp-proxy-{{.OS}}-{{.Arch}}
        format: raw
        supported_envs:
          - linux/amd64
          - darwin/arm64
      - version_constraint: semver("<= 0.3.0")
        asset: mcp-proxy-{{.OS}}-{{.Arch}}
        format: raw
        supported_envs:
          - linux
          - darwin/arm64
      - version_constraint: semver("<= 0.4.2")
        asset: agentproxy-{{.OS}}-{{.Arch}}
        format: raw
        supported_envs:
          - linux
          - darwin/arm64
      - version_constraint: semver("<= 0.4.15")
        asset: agentproxy-{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux
          - darwin/arm64
      - version_constraint: semver("<= 0.7.6")
        asset: agentgateway-{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux
          - darwin/arm64
      - version_constraint: semver("<= 0.9.0")
        asset: agentgateway-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux
          - darwin/arm64
          - windows/amd64
      - version_constraint: semver("<= 0.12.0")
        asset: agentgateway-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
      - version_constraint: semver("<= 1.3.0-alpha.1")
        asset: agentgateway-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux
          - darwin/arm64
          - windows/amd64
      - version_constraint: "true"
        asset: agctl-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux
          - darwin/arm64
          - windows/amd64
