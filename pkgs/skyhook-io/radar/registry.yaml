        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            format: zip
      - version_constraint: semver("<= 1.0.0")
        asset: radar_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
