# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: sinelaw
    repo_name: fresh
    description: "Terminal based IDE & text editor: easy, powerful and fast"
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.87")
        no_asset: true
      - version_constraint: semver("<= 0.2.14")
        asset: fresh-editor-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: linux
            format: tar.gz
          - goos: windows
            format: zip
      - version_constraint: semver("<= 0.4.0")
        asset: fresh-editor-{{.Arch}}-{{.OS}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: linux
            format: tar.gz
          - goos: darwin
            format: tar.xz
      - version_constraint: semver("<= 0.4.6")
        asset: fresh-editor-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: darwin
            format: tar.xz
          - goos: windows
            format: zip
      - version_constraint: semver("<= 0.5.2")
        asset: fresh-editor-{{.Arch}}-{{.OS}}.{{.Format}}
        format: zip
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: linux
            format: tar.gz
          - goos: darwin
            format: tar.xz
      - version_constraint: "true"
        asset: fresh-gui-{{.Arch}}-{{.OS}}.{{.Format}}
        format: zip
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: linux
            format: tar.gz
            asset: fresh-editor-{{.Arch}}-{{.OS}}.{{.Format}}
          - goos: darwin
            format: tar.xz
            asset: fresh-editor-{{.Arch}}-{{.OS}}.{{.Format}}
          - goos: windows
            goarch: arm64
            asset: fresh-editor-{{.Arch}}-{{.OS}}.{{.Format}}
