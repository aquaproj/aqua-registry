# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: floci-io
    repo_name: floci-cli
    description: Official command-line interface for Floci
    files:
      - name: floci
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "0.1.0"
        no_asset: true
      - version_constraint: semver("<= 0.1.4")
        asset: floci-{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: github_release
          asset: sha256sums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin/arm64
          - windows/amd64
      - version_constraint: "true"
        asset: floci-{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: github_release
          asset: sha256sums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
          - windows/amd64
