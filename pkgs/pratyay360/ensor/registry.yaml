packages:
  - type: github_release
    repo_owner: pratyay360
    repo_name: ensor
    description: A fast, interactive CLI for finding and redacting secrets in your codebase
    files:
      - name: ensor
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        asset: ensor_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            format: zip
