# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: zavoloklom
    repo_name: docker-compose-linter
    description: A command-line tool for validating and enforcing best practices in Docker Compose files
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        format: raw
        files:
          - name: dclint
        supported_envs:
          - linux
        overrides:
          - goos: linux
            asset: dclint-alpine-{{.Arch}}
            variants:
              - key: libc
                value: musl
          - goos: linux
            asset: dclint-bullseye-{{.Arch}}
            variants:
              - key: libc
                value: glibc
