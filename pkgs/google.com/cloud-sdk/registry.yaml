# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    name: google.com/cloud-sdk
    repo_owner: google-cloud-sdk-unofficial
    repo_name: google-cloud-sdk
    description: CLI for interacting with Google Cloud products and services
    link: https://cloud.google.com/sdk/docs/install-sdk
    version_source: github_tag
    files:
      - name: gcloud
        src: google-cloud-sdk/bin/gcloud
      - name: gsutil
        src: google-cloud-sdk/bin/gsutil
      - name: docker-credential-gcloud
        src: google-cloud-sdk/bin/docker-credential-gcloud
      - name: bq
        src: google-cloud-sdk/bin/bq
    replacements:
      amd64: x86_64
      arm64: arm
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v181.0.1"
        no_asset: true
      - version_constraint: semver("< 327.0.0")
        url: https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-sdk-{{trimV .Version}}-{{.OS}}-{{.Arch}}.tar.gz
        rosetta2: true
        supported_envs:
          - darwin
          - linux/amd64
      - version_constraint: semver("< 371.0.0")
        url: https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-sdk-{{trimV .Version}}-{{.OS}}-{{.Arch}}.tar.gz
        supported_envs:
          - darwin
          - linux
      - version_constraint: "true"
        url: https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-{{trimV .Version}}-{{.OS}}-{{.Arch}}.tar.gz
        supported_envs:
          - darwin
          - linux
