# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: kunchenguid
    repo_name: treehouse
    description: Manage worktrees without managing worktrees
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.0.0"
        asset: treehouse-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            format: zip
      - version_constraint: "true"
        asset: treehouse-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            format: zip
