# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: kunchenguid
    repo_name: no-mistakes
    description: git push no-mistakes
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.8.1"
        no_asset: true
      - version_constraint: Version == "channels"
        no_asset: true
      - version_constraint: Version == "v1.0.0"
        asset: no-mistakes-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        supported_envs:
          - linux
          - darwin
      - version_constraint: Version == "v1.1.0"
        asset: no-mistakes-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            format: zip
      - version_constraint: "true"
        asset: no-mistakes-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            format: zip
