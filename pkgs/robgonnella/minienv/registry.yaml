# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: robgonnella
    repo_name: minienv
    description: Effortless remote mini environments generated directly from docker compose config
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1.0"
        no_asset: true
      - version_constraint: "true"
        asset: minienv-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tgz
