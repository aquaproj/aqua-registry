# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: robgonnella
    repo_name: releasaurus
    description: A comprehensive release automation tool that streamlines the software release process across multiple programming languages and forge platforms
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.4.5"
        asset: releasaurus-{{.Arch}}-{{.OS}}-{{.Version}}
        format: raw
        replacements:
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
        overrides:
          - goos: linux
            replacements:
              amd64: x86_64
        supported_envs:
          - linux
          - darwin/arm64
      - version_constraint: Version == "v0.4.6"
        asset: releasaurus-{{.Arch}}-{{.OS}}-{{.Version}}
        format: raw
        windows_arm_emulation: true
        complete_windows_ext: false
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: darwin
            replacements:
              amd64: amd64
          - goos: windows
            asset: releasaurus.exe-{{.Arch}}-{{.OS}}-{{.Version}}
        supported_envs:
          - linux
          - darwin/arm64
          - windows/amd64
      - version_constraint: semver("<= 0.4.10")
        no_asset: true
      - version_constraint: "true"
        asset: releasaurus-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tgz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: darwin
            replacements:
              amd64: amd64
        supported_envs:
          - linux
          - darwin/arm64
          - windows/amd64
