# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: takumin
    repo_name: qemu-bin
    description: Prebuilt binaries of `qemu` built with zig cc
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        asset: qemu-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
          linux: linux-gnu
        checksum:
          type: github_release
          asset: SHA256SUMS
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity-regexp
              - "^https://github\\.com/takumin/qemu-bin/\\.github/workflows/.+\\.ya?ml@refs/tags/\\Q{{.Version}}\\E$"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
            bundle:
              type: github_release
              asset: SHA256SUMS.sigstore.json
        supported_envs:
          - linux
