# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: takumin
    repo_name: passt-bin
    description: Prebuilt binaries of `passt` built with zig cc
    files:
      - name: passt
        src: bin/passt
      - name: pasta
        src: bin/pasta
      - name: passt-repair
        src: bin/passt-repair
      - name: pesto
        src: bin/pesto
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        asset: passt-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
          linux: linux-gnu
        checksum:
          type: github_release
          asset: SHA256SUMS
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity
              - https://github.com/takumin/passt-bin/.github/workflows/wc-sign.yml@refs/heads/main
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --certificate-github-workflow-repository
              - takumin/passt-bin
            bundle:
              type: github_release
              asset: SHA256SUMS.sigstore.json
        github_artifact_attestations:
          signer_workflow: takumin/passt-bin/.github/workflows/wc-sign.yml
        supported_envs:
          - linux
