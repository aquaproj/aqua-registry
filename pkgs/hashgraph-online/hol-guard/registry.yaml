# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: hashgraph-online
    repo_name: hol-guard
    description: "Open-source antivirus for AI agents: block risky tools, secret access, prompt injection, malicious packages, MCP servers, plugins, and skills at runtime"
    version_filter: Version startsWith "v" and semver(">= 3.0.189")
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 2.0.1116")
        slsa_provenance:
          type: github_release
          asset: plugin-scanner-{{.Version}}.intoto.jsonl
      - version_constraint: semver("<= 2.0.1127")
        slsa_provenance:
          type: github_release
