        windows_arm_emulation: true
        complete_windows_ext: false
        replacements:
          amd64: x86_64
          darwin: macosx
          windows: win
        slsa_provenance:
          type: github_release
          asset: hol-guard-{{.SemVer}}.intoto.jsonl
        overrides:
          - goos: darwin
            goarch: amd64
            asset: hol_guard-3.0.0a100-py3-none-{{.OS}}_13_0_{{.Arch}}.whl
          - goos: darwin
