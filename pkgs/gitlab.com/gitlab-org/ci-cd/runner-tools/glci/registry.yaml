# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    name: gitlab.com/gitlab-org/ci-cd/runner-tools/glci
    url: https://gitlab.com/api/v4/projects/80906769/packages/generic/glci/{{.Version}}/glci-{{.OS}}-{{.Arch}}
    format: raw
    description: A tool for running GitLab CI jobs locally
    version_constraint: "false"
    supported_envs:
      - darwin/amd64
      - darwin/arm64
      - linux/amd64
      - linux/arm64
