# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Future-Element
    repo_name: pinset
    description: A predictable, local-first runtime version manager for multilingual projects
    files:
      - name: pinset
      - name: pinset-shim
    github_artifact_attestations:
      signer_workflow: Future-Element/pinset/.github/workflows/release.yml
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 2.15.0")
        no_asset: true
      - version_constraint: semver("<= 2.16.2")
        asset: pinset-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: false
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: macos
        checksum:
          type: github_release
          asset: SHA256SUMS
          algorithm: sha256
        overrides:
          - goos: windows
            format: zip
        supported_envs:
          - linux
          - darwin/arm64
          - windows/amd64
      - version_constraint: "true"
        asset: pinset-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: false
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: macos
        checksum:
          type: github_release
          asset: SHA256SUMS
          algorithm: sha256
        supported_envs:
          - linux
          - darwin/arm64
          - windows/amd64
