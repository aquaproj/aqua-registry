# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: d2lang
    repo_name: d2
    aliases:
      - name: terrastruct/d2
    description: D2 is a modern diagram scripting language that turns text to diagrams
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("< 0.8.2")
        asset: d2-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz
        replacements:
          darwin: macos
        files:
          - name: d2
            src: d2-{{.Version}}/bin/d2
      - version_constraint: "true"
        asset: d2-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz
        replacements:
          darwin: macos
        files:
          - name: d2
            src: d2-{{.Version}}/bin/d2
        github_artifact_attestations:
          signer_workflow: d2lang/d2/.github/workflows/release-archives.yml
