# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: plumlang
    repo_name: plumlang
    description: "Plumlang: a small, fast, memory-safe programming language with a plain-English syntax. Static types, OOP, tasks, networking, TLS and HTTP in one dependency-free binary. An Elixpo production"
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        asset: plum-{{trimV .Version}}-{{.OS}}-universal.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: macos
        checksum:
          type: github_release
          asset: SHA256SUMS
          algorithm: sha256
        overrides:
          - goos: linux
            asset: plum-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
          - goos: windows
            format: zip
            asset: plum-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
