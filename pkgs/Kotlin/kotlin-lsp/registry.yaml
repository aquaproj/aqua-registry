# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    repo_owner: Kotlin
    repo_name: kotlin-lsp
    description: Official Kotlin Language Server by JetBrains
    version_prefix: kotlin-lsp/v
    version_source: github_tag
    files:
      - name: kotlin-lsp
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("< 262.8190.0")
        no_asset: true
      - version_constraint: "true"
        url: https://download.jetbrains.com/language-server/kotlin-server/{{.SemVer}}/kotlin-server-{{.SemVer}}.tar.gz
        format: tar.gz
        append_ext: false
        checksum:
          type: http
          url: https://download.jetbrains.com/language-server/kotlin-server/{{.SemVer}}/kotlin-server-{{.SemVer}}.tar.gz.sha256
          algorithm: sha256
        files:
          - name: kotlin-lsp
            src: kotlin-server-{{.SemVer}}/bin/intellij-server
        overrides:
          - goos: linux
            goarch: arm64
            url: https://download.jetbrains.com/language-server/kotlin-server/{{.SemVer}}/kotlin-server-{{.SemVer}}-aarch64.tar.gz
            checksum:
              type: http
              url: https://download.jetbrains.com/language-server/kotlin-server/{{.SemVer}}/kotlin-server-{{.SemVer}}-aarch64.tar.gz.sha256
              algorithm: sha256
          - goos: darwin
            goarch: amd64
            url: https://download.jetbrains.com/language-server/kotlin-server/{{.SemVer}}/kotlin-server-{{.SemVer}}.sit
            format: zip
            checksum:
              type: http
              url: https://download.jetbrains.com/language-server/kotlin-server/{{.SemVer}}/kotlin-server-{{.SemVer}}.sit.sha256
              algorithm: sha256
          - goos: darwin
            goarch: arm64
            url: https://download.jetbrains.com/language-server/kotlin-server/{{.SemVer}}/kotlin-server-{{.SemVer}}-aarch64.sit
            format: zip
            checksum:
              type: http
              url: https://download.jetbrains.com/language-server/kotlin-server/{{.SemVer}}/kotlin-server-{{.SemVer}}-aarch64.sit.sha256
              algorithm: sha256
          - goos: windows
            goarch: amd64
            url: https://download.jetbrains.com/language-server/kotlin-server/{{.SemVer}}/kotlin-server-{{.SemVer}}.win.zip
            format: zip
            checksum:
              type: http
              url: https://download.jetbrains.com/language-server/kotlin-server/{{.SemVer}}/kotlin-server-{{.SemVer}}.win.zip.sha256
              algorithm: sha256
            files:
              - name: kotlin-lsp
                src: bin/intellij-server
          - goos: windows
            goarch: arm64
            url: https://download.jetbrains.com/language-server/kotlin-server/{{.SemVer}}/kotlin-server-{{.SemVer}}-aarch64.win.zip
            format: zip
            checksum:
              type: http
              url: https://download.jetbrains.com/language-server/kotlin-server/{{.SemVer}}/kotlin-server-{{.SemVer}}-aarch64.win.zip.sha256
              algorithm: sha256
            files:
              - name: kotlin-lsp
                src: bin/intellij-server
