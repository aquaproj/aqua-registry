# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: cargo-lambda
    repo_name: cargo-lambda
    description: Cargo Lambda is a Cargo subcommand to help you work with AWS Lambda
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.8.1-alpha.4"
        asset: cargo-lambda-{{.Version}}.{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          darwin: apple-darwin
          linux: unknown-linux-musl
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: linux
            replacements:
              amd64: x86_64
              arm64: aarch64
          - goos: darwin
            asset: cargo-lambda-{{.Version}}.{{.OS}}.{{.Format}}
          - goos: windows
            format: zip
            asset: cargo-lambda-{{.Version}}.{{.OS}}-{{.Arch}}.{{.Format}}
            replacements:
              amd64: x64
      - version_constraint: Version in ["v0.10.0", "v0.10.1", "v0.11.0"]
