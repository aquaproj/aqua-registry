# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: WebAssembly
    repo_name: binaryen
    description: Optimizer and compiler/toolchain library for WebAssembly
    asset: binaryen-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
    format: tar.gz
    replacements:
      amd64: x86_64
      darwin: macos
    supported_envs:
      - darwin
      - amd64
    version_prefix: version_
    checksum:
      type: github_release
      asset: "{{.Asset}}.sha256"
      algorithm: sha256
    files:
      - name: binaryen-unittests
        src: binaryen-{{.Version}}/bin/binaryen-unittests
      - name: wasm-as
        src: binaryen-{{.Version}}/bin/wasm-as
      - name: wasm-ctor-eval
        src: binaryen-{{.Version}}/bin/wasm-ctor-eval
      - name: wasm-dis
        src: binaryen-{{.Version}}/bin/wasm-dis
      - name: wasm-emscripten-finalize
        src: binaryen-{{.Version}}/bin/wasm-emscripten-finalize
      - name: wasm-fuzz-types
        src: binaryen-{{.Version}}/bin/wasm-fuzz-types
      - name: wasm-metadce
        src: binaryen-{{.Version}}/bin/wasm-metadce
      - name: wasm-opt
        src: binaryen-{{.Version}}/bin/wasm-opt
      - name: wasm-reduce
        src: binaryen-{{.Version}}/bin/wasm-reduce
      - name: wasm-shell
        src: binaryen-{{.Version}}/bin/wasm-shell
      - name: wasm-split
        src: binaryen-{{.Version}}/bin/wasm-split
      - name: wasm2js
        src: binaryen-{{.Version}}/bin/wasm2js
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver(">= 108")
      - version_constraint: semver(">= 106")
        supported_envs:
          - darwin
          - windows/amd64
      - version_constraint: semver(">= 105")
        files:
          - name: wasm-as
            src: binaryen-{{.Version}}/bin/wasm-as
          - name: wasm-ctor-eval
            src: binaryen-{{.Version}}/bin/wasm-ctor-eval
          - name: wasm-dis
            src: binaryen-{{.Version}}/bin/wasm-dis
          - name: wasm-emscripten-finalize
            src: binaryen-{{.Version}}/bin/wasm-emscripten-finalize
          - name: wasm-fuzz-types
            src: binaryen-{{.Version}}/bin/wasm-fuzz-types
          - name: wasm-metadce
            src: binaryen-{{.Version}}/bin/wasm-metadce
          - name: wasm-opt
            src: binaryen-{{.Version}}/bin/wasm-opt
          - name: wasm-reduce
            src: binaryen-{{.Version}}/bin/wasm-reduce
          - name: wasm-shell
            src: binaryen-{{.Version}}/bin/wasm-shell
          - name: wasm-split
            src: binaryen-{{.Version}}/bin/wasm-split
          - name: wasm2js
            src: binaryen-{{.Version}}/bin/wasm2js
      - version_constraint: semver(">= 100")
        rosetta2: true
        overrides:
          - goos: windows
            checksum:
              enabled: false
        files:
          - name: wasm-as
            src: binaryen-{{.Version}}/bin/wasm-as
          - name: wasm-ctor-eval
            src: binaryen-{{.Version}}/bin/wasm-ctor-eval
          - name: wasm-dis
            src: binaryen-{{.Version}}/bin/wasm-dis
          - name: wasm-emscripten-finalize
            src: binaryen-{{.Version}}/bin/wasm-emscripten-finalize
          - name: wasm-metadce
            src: binaryen-{{.Version}}/bin/wasm-metadce
          - name: wasm-opt
            src: binaryen-{{.Version}}/bin/wasm-opt
          - name: wasm-reduce
            src: binaryen-{{.Version}}/bin/wasm-reduce
          - name: wasm-shell
            src: binaryen-{{.Version}}/bin/wasm-shell
          - name: wasm-split
            src: binaryen-{{.Version}}/bin/wasm-split
          - name: wasm2js
            src: binaryen-{{.Version}}/bin/wasm2js
      # `version_prefix` also filters versions, so the 1.x tags never reach a branch that
      # inherits it. Reset it here so every dropped version gets this message.
      - version_constraint: "true"
        version_prefix: ""
        error_message: Please upgrade to version_100 or higher
