# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: goss-org
    repo_name: goss
    aliases:
      - name: aelsabbahy/goss
    description: Quick and Easy server testing/validation
    rosetta2: true
    supported_envs:
      - darwin
      - linux
      - amd64
    asset: goss-{{.OS}}-{{.Arch}}
    checksum:
      type: github_release
      asset: "{{.Asset}}.sha256"
      algorithm: sha256
    version_constraint: semver(">= 0.4.0, < 0.4.10")
    version_overrides:
      # 0.4.10 switched to GoReleaser tarballs (goss_<ver>_<os>_<arch>.tar.gz,
      # amd64->x86_64) with a single SHA256SUMS file.
      - version_constraint: semver(">= 0.4.10")
        asset: goss_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
        format: tar.gz
        checksum:
          type: github_release
          asset: goss_{{trimV .Version}}_SHA256SUMS
          algorithm: sha256
        replacements:
          amd64: x86_64
          "386": i386
          arm: armv6
        overrides:
          - goos: windows
            format: zip
      - version_constraint: semver("< 0.4.0")
        replacements:
          windows: alpha-windows
          darwin: alpha-darwin
