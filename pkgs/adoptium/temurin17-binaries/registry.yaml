# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: adoptium
    repo_name: temurin17-binaries
    description: Temurin 17 binaries
    version_filter: not (Version matches "-beta$")
    version_prefix: jdk-
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "jdk-17.0.4.1+1"
        asset: OpenJDK17U-jdk_{{.Arch}}_{{.OS}}_hotspot_17.0.4.1_1.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x64
          arm64: aarch64
          darwin: mac
        checksum:
          type: github_release
          asset: OpenJDK17U-static-libs_{{.Arch}}_{{.OS}}_hotspot_17.0.4.1_1.tar.gz.sha256.txt
          algorithm: sha256
        overrides:
          - goos: linux
            goarch: amd64
            asset: OpenJDK17U-jdk_{{.Arch}}_alpine-{{.OS}}_hotspot_17.0.4.1_1.{{.Format}}
            variants:
              - key: libc
                value: glibc
          - goos: linux
            goarch: amd64
            asset: OpenJDK17U-static-libs-musl_{{.Arch}}_alpine-{{.OS}}_hotspot_17.0.4.1_1.{{.Format}}
            variants:
              - key: libc
                value: musl
          - goos: linux
            goarch: amd64
            asset: OpenJDK17U-jdk_{{.Arch}}_alpine-{{.OS}}_hotspot_17.0.4.1_1.{{.Format}}
          - goos: windows
            format: zip
