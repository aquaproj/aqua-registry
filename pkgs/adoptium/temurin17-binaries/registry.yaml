    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "jdk-17+35"
        asset: OpenJDK17-jdk_{{.Arch}}_{{.OS}}_hotspot_{{.SemVer | replace "+" "_"}}.{{.Format}}
      # The aarch64 Linux archive of 17.0.2+8 has no .sha256.txt file, so read the checksum from the metadata file of each archive.
      - version_constraint: Version == "jdk-17.0.2+8"
        checksum:
          type: github_release
          asset: "{{.Asset}}.json"
          algorithm: sha256
          file_format: regexp
          pattern:
            checksum: '"sha256": "([0-9a-f]{64})"'
      # The Windows x64 build of 17.0.9+9 was published as jdk-17.0.9+9.1.
      - version_constraint: Version == "jdk-17.0.9+9"
        supported_envs:
          - darwin
          - linux
      # The respin keeps the asset names and the directory of 17.0.9+9.
      - version_constraint: Version == "jdk-17.0.9+9.1"
        asset: OpenJDK17U-jdk_{{.Arch}}_{{.OS}}_hotspot_17.0.9_9.{{.Format}}
        supported_envs:
          - windows
        overrides:
