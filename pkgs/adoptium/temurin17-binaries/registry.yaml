# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: adoptium
    repo_name: temurin17-binaries
    description: Eclipse Temurin JDK 17
    search_words:
      - jdk
      - openjdk
    version_filter: Version matches "^jdk-17\\.[\\d.]+\\+\\d+$"
    version_prefix: jdk-
    asset: OpenJDK17U-jdk_{{.Arch}}_{{.OS}}_hotspot_{{.SemVer | replace "+" "_"}}.{{.Format}}
    format: tar.gz
    # Temurin doesn't publish Windows ARM64 builds of JDK 17, so use the x64 build.
    windows_arm_emulation: true
    replacements:
      amd64: x64
      arm64: aarch64
      darwin: mac
    checksum:
      type: github_release
      asset: "{{.Asset}}.sha256.txt"
      algorithm: sha256
    files:
      - name: jar
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jarsigner
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: java
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: javac
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: javadoc
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: javap
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jcmd
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jconsole
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jdb
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jdeprscan
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jdeps
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jfr
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jhsdb
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jimage
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jinfo
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jlink
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jmap
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jmod
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jpackage
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jps
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jrunscript
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jshell
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jstack
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jstat
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jstatd
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: keytool
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: rmiregistry
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: serialver
        src: "{{.Version}}/bin/{{.FileName}}"
    overrides:
      - goos: linux
        variants:
          - key: libc
            value: glibc
      # JDK 17 has no Alpine build for aarch64. On musl arm64, aqua installs the glibc build,
      # which needs /lib/ld-linux-aarch64.so.1 and doesn't run on a standard Alpine system.
      - goos: linux
        goarch: amd64
        variants:
          - key: libc
            value: musl
        replacements:
          linux: alpine-linux
        # Alpine builds are headless, so jconsole can't run on them.
        files:
          - name: jar
            src: "{{.Version}}/bin/{{.FileName}}"
          - name: jarsigner
            src: "{{.Version}}/bin/{{.FileName}}"
