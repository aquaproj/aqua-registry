        src: "{{.Version}}/bin/{{.FileName}}"
      - name: serialver
        src: "{{.Version}}/bin/{{.FileName}}"
    overrides:
      - goos: linux
        variants:
          - key: libc
            value: glibc
      - goos: linux
        variants:
          - key: libc
            value: musl
        replacements:
          linux: alpine-linux
