# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: adoptium
    repo_name: temurin25-binaries
    description: Eclipse Temurin JDK 25
    search_words:
      - jdk
      - openjdk
    version_filter: Version matches "^jdk-25\\.[\\d.]+\\+\\d+$"
    version_prefix: jdk-
    asset: OpenJDK25U-jdk_{{.Arch}}_{{.OS}}_hotspot_{{.SemVer | replace "+" "_"}}.{{.Format}}
    format: tar.gz
    # Temurin doesn't publish Windows ARM64 builds of JDK 25, so use the x64 build.
    windows_arm_emulation: true
    replacements:
      amd64: x64
      arm64: aarch64
      darwin: mac
    checksum:
      type: github_release
      asset: "{{.Asset}}.sha256.txt"
      algorithm: sha256
    files:
      - name: jar
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jarsigner
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: java
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: javac
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: javadoc
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: javap
        src: "{{.Version}}/bin/{{.FileName}}"
      - name: jcmd
