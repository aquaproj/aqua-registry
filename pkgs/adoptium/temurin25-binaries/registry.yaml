# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: adoptium
    repo_name: temurin25-binaries
    description: Temurin 25 binaries
    version_filter: not (Version matches "-beta$")
    version_prefix: jdk-
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "jdk-25.0.1+8"
        asset: OpenJDK25U-jdk_{{.Arch}}_alpine-{{.OS}}_hotspot_25.0.1_8.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x64
          arm64: aarch64
          darwin: mac
        checksum:
          type: github_release
          asset: OpenJDK25U-debugimage_{{.Arch}}_{{.OS}}_hotspot_25.0.1_8.zip.sha256.txt
          algorithm: sha256
        overrides:
          - goos: linux
            variants:
              - key: libc
                value: glibc
          - goos: linux
            asset: OpenJDK25U-static-libs-musl_{{.Arch}}_alpine-{{.OS}}_hotspot_25.0.1_8.{{.Format}}
            variants:
              - key: libc
                value: musl
          - goos: darwin
            asset: OpenJDK25U-jdk_{{.Arch}}_{{.OS}}_hotspot_25.0.1_8.{{.Format}}
          - goos: windows
            format: zip
            asset: OpenJDK25U-jdk_{{.Arch}}_{{.OS}}_hotspot_25.0.1_8.{{.Format}}
      - version_constraint: Version == "jdk-25.0.2+10"
