# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: adoptium
    repo_name: temurin21-binaries
    description: Temurin 21 binaries
    version_filter: not (Version matches "-beta$")
    version_prefix: jdk-
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "jdk-21.0.1+12"
        asset: OpenJDK21U-jdk_{{.Arch}}_alpine-{{.OS}}_hotspot_21.0.1_12.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x64
          arm64: aarch64
          darwin: mac
        checksum:
          type: github_release
          asset: OpenJDK21U-jdk_{{.Arch}}_{{.OS}}_hotspot_21.0.1_12.tar.gz.sha256.txt
          algorithm: sha256
        overrides:
          - goos: linux
            variants:
              - key: libc
                value: glibc
          - goos: linux
            asset: OpenJDK21U-static-libs-musl_{{.Arch}}_alpine-{{.OS}}_hotspot_21.0.1_12.{{.Format}}
            variants:
              - key: libc
                value: musl
          - goos: darwin
            asset: OpenJDK21U-jdk_{{.Arch}}_{{.OS}}_hotspot_21.0.1_12.{{.Format}}
          - goos: windows
            format: zip
            asset: OpenJDK21U-jdk_{{.Arch}}_{{.OS}}_hotspot_21.0.1_12.{{.Format}}
