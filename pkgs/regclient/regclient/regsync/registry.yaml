# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: regclient/regclient/regsync
    type: github_release
    repo_owner: regclient
    repo_name: regclient
    asset: regsync-{{.OS}}-{{.Arch}}
    format: raw
    files:
      - name: regsync
    description: Docker and OCI image mirroring tool
    supported_envs:
      - darwin
      - linux
      - amd64
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("< 0.3.9")
        rosetta2: true
      - version_constraint: semver("< 0.11.6")
      - version_constraint: "true"
        cosign:
          bundle:
            type: github_release
            asset: regsync-{{.OS}}-{{.Arch}}.sigstore.json
          opts:
            - --certificate-identity
            - https://github.com/regclient/regclient/.github/workflows/go.yml@refs/tags/{{.Version}}
            - --certificate-oidc-issuer
            - https://token.actions.githubusercontent.com
