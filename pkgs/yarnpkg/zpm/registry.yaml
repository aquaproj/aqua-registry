packages:
  - type: github_release
    repo_owner: yarnpkg
    repo_name: zpm
    description: Safe, stable, reproducible projects
    files:
      - name: yarn
    asset: yarn-{{.Arch}}-{{.OS}}.{{.Format}}
    format: zip
    overrides:
      - goos: linux
        replacements:
          amd64: x86_64
    replacements:
      arm64: aarch64
      darwin: apple-darwin
      linux: unknown-linux-musl
    supported_envs:
      - linux
      - darwin/arm64
