# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: astral-sh
    repo_name: ruff
    description: An extremely fast Python linter and code formatter, written in Rust
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.0.246")
        no_asset: true
      - version_constraint: semver("<= 0.1.7")
        asset: ruff-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            variants:
              - key: libc
                value: glibc
          - goos: linux
            replacements:
              linux: unknown-linux-musl
            variants:
              - key: libc
                value: musl
          - goos: windows
            format: zip
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
      - version_constraint: semver("<= 0.4.10")
        asset: ruff-{{trimV .Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            variants:
              - key: libc
                value: glibc
          - goos: linux
            replacements:
              linux: unknown-linux-musl
            variants:
              - key: libc
                value: musl
          - goos: windows
            format: zip
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
      - version_constraint: semver("<= 0.15.1")
        asset: ruff-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        files:
          - name: ruff
            src: "{{.AssetWithoutExt}}/ruff"
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            variants:
              - key: libc
                value: glibc
          - goos: linux
            replacements:
              linux: unknown-linux-musl
            variants:
              - key: libc
                value: musl
          - goos: windows
            format: zip
            files:
              - name: ruff
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
      - version_constraint: "true"
        asset: ruff-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        files:
          - name: ruff
            src: "{{.AssetWithoutExt}}/ruff"
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            variants:
              - key: libc
                value: glibc
          - goos: linux
            replacements:
              linux: unknown-linux-musl
            variants:
              - key: libc
                value: musl
          - goos: windows
            format: zip
            files:
              - name: ruff
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        github_artifact_attestations:
          signer_workflow: astral-sh/ruff/.github/workflows/release.yml
