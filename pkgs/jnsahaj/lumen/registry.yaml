# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: jnsahaj
    repo_name: lumen
    description: Beautiful git diff viewer, generate commits with AI, get summary of changes, all from the CLI
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 2.4.0")
        asset: lumen.{{.Format}}
        format: tar.gz
        supported_envs:
          - darwin/arm64
      - version_constraint: semver("<= 2.30.0")
        asset: lumen-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
        supported_envs:
          - darwin
      - version_constraint: "true"
        asset: lumen-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
        github_artifact_attestations:
          signer_workflow: jnsahaj/lumen/.github/workflows/release.yml
