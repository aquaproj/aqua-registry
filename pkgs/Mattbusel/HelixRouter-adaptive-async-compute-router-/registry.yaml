# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Mattbusel
    repo_name: HelixRouter-adaptive-async-compute-router-
    description: "Adaptive job router for Tokio: per job, choose inline, spawn, CPU pool, batch or drop from job cost, latency budget and live pressure, with online learning, Prometheus metrics and a live dashboard"
    files:
      - name: helixrouter
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.0.0")
        no_asset: true
      - version_constraint: "true"
        asset: helixrouter-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        checksum:
          type: github_release
          asset: SHA256SUMS.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            replacements:
              arm64: aarch64
          - goos: windows
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
