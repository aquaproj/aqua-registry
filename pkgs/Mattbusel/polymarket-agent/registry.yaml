# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Mattbusel
    repo_name: polymarket-agent
    description: "Polymarket for AI agents: one Rust CLI + MCP server (search, books, attributed CLOB v2 orders)"
    files:
      - name: polymarket-agent
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        asset: polymarket-agent-{{.Version}}-{{.OS}}.{{.Format}}
        format: tar.gz
        checksum:
          type: github_release
          asset: SHA256SUMS.txt
          algorithm: sha256
        overrides:
          - goos: windows
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
