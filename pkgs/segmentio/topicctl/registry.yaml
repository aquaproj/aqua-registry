# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: go_install
    repo_owner: segmentio
    repo_name: topicctl
    description: Tool for declarative management of Kafka topics
    search_words:
      - kafka
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("< 2.0.0")
        type: go_install
        path: github.com/segmentio/topicctl/cmd/topicctl
      # go.mod still declares `module github.com/segmentio/topicctl` at the v2 tags, so
      # `go install` can't resolve them. Build from the repository archive instead.
      - version_constraint: "true"
        type: go_build
        files:
          - name: topicctl
            src: ./cmd/topicctl
            dir: topicctl-{{trimV .Version}}
