# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: microsoft
    repo_name: apm
    description: Agent Package Manager
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.4.2")
        asset: apm-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: apm
            src: "{{.AssetWithoutExt}}/apm"
        replacements:
          amd64: x86_64
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.7.8")
        asset: apm-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: apm
            src: "{{.AssetWithoutExt}}/apm"
        replacements:
          amd64: x86_64
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: "true"
        asset: apm-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: apm
            src: "{{.AssetWithoutExt}}/apm"
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: windows
            format: zip
