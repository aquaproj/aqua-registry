# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: redhat-et
    repo_name: ripwire
    description: A zero-dependency CLI and MCP server for finding context in codebases
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1.0"
        no_asset: true
      - version_constraint: semver("<= 0.2.2")
        asset: ripwire-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: ripwire
            src: ripwire-{{trimV .Version}}-{{.OS}}-{{.Arch}}/ripwire
        replacements:
          amd64: x64
          darwin: macos
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.3.5")
        asset: ripwire-0.2.2-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: ripwire
            src: ripwire-0.2.2-{{.OS}}-{{.Arch}}/ripwire
        replacements:
          amd64: x64
          darwin: macos
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: "true"
        asset: ripwire-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: ripwire
            src: ripwire-{{trimV .Version}}-{{.OS}}-{{.Arch}}/ripwire
        replacements:
          amd64: x64
          darwin: macos
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
