# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Songmu
    repo_name: gocredits
    description: creates CREDITS file from LICENSE files of dependencies
    rosetta2: true
    asset: gocredits_{{.Version}}_{{.OS}}_amd64.{{.Format}}
    supported_envs:
      - darwin
      - linux
    files:
      - name: gocredits
        src: gocredits_{{.Version}}_{{.OS}}_amd64/gocredits
    format: tar.gz
    overrides:
      - goos: darwin
        format: zip
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.0.1")
      - version_constraint: "true"
        github_artifact_attestations:
          signer_workflow: Songmu/gocredits/.github/workflows/release-build.yaml
