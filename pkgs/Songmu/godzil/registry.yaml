# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Songmu
    repo_name: godzil
    asset: godzil_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: zip
    description: A Go Authoring tool
    overrides:
      - goos: linux
        format: tar.gz
    files:
      - name: godzil
        src: godzil_{{.Version}}_{{.OS}}_{{.Arch}}/godzil
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("< 0.23.0")
      - version_constraint: "true"
        github_artifact_attestations:
          signer_workflow: Songmu/godzil/.github/workflows/release-build.yaml
