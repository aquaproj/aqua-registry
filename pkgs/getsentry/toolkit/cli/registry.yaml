# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: getsentry/toolkit/cli
    type: github_release
    repo_owner: getsentry
    repo_name: toolkit
    description: Sentry command-line tool for error monitoring and debugging
    version_prefix: cli@
    # getsentry/toolkit also publishes MCP server releases with unprefixed tags
    version_filter: Version startsWith "cli@"
    files:
      - name: sentry
    version_constraint: "false"
    version_overrides:
      # getsentry/cli was archived and the CLI moved to getsentry/toolkit at cli@0.46.0.
      # Older versions are downloaded from getsentry/cli with http rather than github_release,
      # because aqua looks up new versions in the repository of the pinned version's override
      # and aqua update must find the cli@ releases in getsentry/toolkit.
      # scaffold.yaml doesn't generate them.
      - version_constraint: semver("<= 0.10.3")
        type: http
        url: https://github.com/getsentry/cli/releases/download/{{.Version}}/sentry-{{.OS}}-{{.Arch}}
        version_prefix: ""
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x64
      - version_constraint: semver("<= 0.27.0")
        type: http
        url: https://github.com/getsentry/cli/releases/download/{{.Version}}/sentry-{{.OS}}-{{.Arch}}.{{.Format}}
        version_prefix: ""
        format: gz
        windows_arm_emulation: true
        files:
          - name: sentry
            src: "{{.AssetWithoutExt}}"
        replacements:
          amd64: x64
        overrides:
          - goos: windows
            url: https://github.com/getsentry/cli/releases/download/{{.Version}}/sentry-{{.OS}}-{{.Arch}}.exe.{{.Format}}
      - version_constraint: semver("<= 0.34.0")
        type: http
        url: https://github.com/getsentry/cli/releases/download/{{.Version}}/sentry-{{.OS}}-{{.Arch}}.{{.Format}}
        version_prefix: ""
        format: gz
        windows_arm_emulation: true
        files:
          - name: sentry
            src: "{{.AssetWithoutExt}}"
        replacements:
          amd64: x64
        overrides:
          - goos: linux
            variants:
              - key: libc
                value: glibc
          - goos: linux
            url: https://github.com/getsentry/cli/releases/download/{{.Version}}/sentry-{{.OS}}-{{.Arch}}-musl.{{.Format}}
            variants:
              - key: libc
                value: musl
          - goos: windows
            url: https://github.com/getsentry/cli/releases/download/{{.Version}}/sentry-{{.OS}}-{{.Arch}}.exe.{{.Format}}
      - version_constraint: semver("<= 0.45.0")
        type: http
        url: https://github.com/getsentry/cli/releases/download/{{.Version}}/sentry-{{.OS}}-{{.Arch}}.{{.Format}}
        version_prefix: ""
        format: gz
        windows_arm_emulation: true
        files:
          - name: sentry
            src: "{{.AssetWithoutExt}}"
        replacements:
          amd64: x64
        overrides:
          - goos: windows
            url: https://github.com/getsentry/cli/releases/download/{{.Version}}/sentry-{{.OS}}-{{.Arch}}.exe.{{.Format}}
      - version_constraint: "true"
        asset: sentry-{{.OS}}-{{.Arch}}.{{.Format}}
        format: gz
        windows_arm_emulation: true
        files:
          - name: sentry
            src: "{{.AssetWithoutExt}}"
        replacements:
          amd64: x64
        overrides:
          - goos: windows
            asset: sentry-{{.OS}}-{{.Arch}}.exe.{{.Format}}
