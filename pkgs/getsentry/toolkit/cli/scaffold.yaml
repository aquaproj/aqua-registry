# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/aqua-generate-registry.json
# This only generates the cli@ releases in getsentry/toolkit.
# The version_overrides up to 0.45.0 in registry.yaml come from the archived getsentry/cli:
# they were generated by `aqua gr --cmd sentry getsentry/cli` and converted to type: http by hand.
# Keep them when you regenerate registry.yaml.
name: getsentry/toolkit/cli
version_prefix: cli@
