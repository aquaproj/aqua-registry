# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: reylosql
    repo_name: reylo
    description: Import .sql files into TypeScript with full type inference and zero codegen
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.6.0")
        no_asset: true
      - version_constraint: "true"
        asset: reylo-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x64
          windows: win32
        checksum:
          type: github_release
          asset: SHA256SUMS
          algorithm: sha256
        overrides:
          - goos: linux
            variants:
              - key: libc
                value: glibc
          - goos: linux
            asset: reylo-{{.OS}}-{{.Arch}}-musl.{{.Format}}
            variants:
              - key: libc
                value: musl
