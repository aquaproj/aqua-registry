# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: jetify-com
    repo_name: devbox
    aliases:
      - name: jetpack-io/devbox
    description: Instant, easy, and predictable development environments
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("< 0.22.0")
        asset: devbox_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: "true"
        asset: devbox_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
        github_artifact_attestations:
          signer_workflow: jetify-com/devbox/.github/workflows/cli-release.yml
