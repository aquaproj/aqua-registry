# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: jdx
    repo_name: jactionlint
    description: Static checker for GitHub Actions workflow files
    files:
      - name: jactionlint
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.8.0"
        no_asset: true
      - version_constraint: "true"
        asset: jactionlint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: github_release
          asset: jactionlint_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            format: zip
        github_artifact_attestations:
          signer_workflow: jdx/jactionlint/.github/workflows/release.yaml
