# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    repo_owner: ryan-pip
    repo_name: dbt-fusion-versions
    name: getdbt.com/dbt-fusion
    description: The next-generation engine for dbt
    link: https://docs.getdbt.com/docs/local/install-dbt
    version_source: github_tag
    url: https://public.cdn.getdbt.com/fs/cli/fs-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
    format: tar.gz
    windows_arm_emulation: true
    replacements:
      linux: unknown-linux-gnu
      darwin: apple-darwin
      windows: pc-windows-msvc
      amd64: x86_64
      arm64: aarch64
    files:
      - name: dbt
    overrides:
      - goos: windows
        format: zip
