# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    repo_owner: anthropics
    repo_name: claude-code
    description: Claude Code is an agentic coding tool that lives in your terminal, understands your codebase, and helps you code faster by executing routine tasks, explaining complex code, and handling git workflows - all through natural language commands
    files:
      - name: claude
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v2.1.88"
        no_asset: true
      - version_constraint: semver("<= 2.1.117") or Version == "v2.1.126"
        format: raw
        url: https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{{trimV .Version}}/{{.OS}}-{{.Arch}}/claude
        files:
          - name: claude
        replacements:
          amd64: x64
        overrides:
          - goos: linux
            variants:
              - key: libc
                value: glibc
          - goos: linux
            url: https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{{trimV .Version}}/{{.OS}}-{{.Arch}}-musl/claude
            variants:
              - key: libc
                value: musl
        supported_envs:
          - darwin
          - linux
      - version_constraint: "true"
        type: github_release
        asset: claude-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: linux
            variants:
              - key: libc
                value: glibc
          - goos: linux
            asset: claude-{{.OS}}-{{.Arch}}-musl.{{.Format}}
            variants:
              - key: libc
                value: musl
          - goos: windows
            format: zip
        files:
          - name: claude
        replacements:
          amd64: x64
          windows: win32
        checksum:
          type: github_release
          asset: SHASUMS256.txt
          algorithm: sha256
