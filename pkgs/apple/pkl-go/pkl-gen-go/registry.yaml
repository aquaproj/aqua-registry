# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: apple/pkl-go/pkl-gen-go
    type: github_release
    repo_owner: apple
    repo_name: pkl-go
    description: Generates Go bindings for a Pkl module
    version_filter: 'Version startsWith "v"'
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver(">= 0.13.0")
        error_message: |
          Releases since v0.13.0 don't include pkl-gen-go binaries.

          https://github.com/apple/pkl-go/releases
      - version_constraint: "true"
        asset: pkl-gen-go-{{.OS}}-{{.Arch}}.bin
        format: raw
        replacements:
          darwin: macos
        overrides:
          - goos: linux
            replacements:
              arm64: aarch64
          - goos: darwin
            asset: pkl-gen-go-{{.OS}}.bin
        supported_envs:
          - linux
          - darwin
