# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: knative
    repo_name: client
    format: raw
    asset: kn-{{.OS}}-{{.Arch}}
    description: Knative developer experience, docs, reference Knative CLI implementation
    files:
      - name: kn
    supported_envs:
      - darwin
      - linux
      - amd64
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      # checksums.txt is signed from knative-v1.8.0, keyless, by Knative's release service account.
      cosign:
        opts:
          - --certificate-identity
          - signer@knative-releases.iam.gserviceaccount.com
          - --certificate-oidc-issuer
          - https://accounts.google.com
          - --signature
          - https://github.com/knative/client/releases/download/{{.Version}}/checksums.txt.sig
          - --certificate
          - https://github.com/knative/client/releases/download/{{.Version}}/checksums.txt.pem
    version_constraint: semverWithVersion(">= 1.8.0", trimPrefix(Version, "knative-"))
    version_overrides:
      - version_constraint: "true"
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
