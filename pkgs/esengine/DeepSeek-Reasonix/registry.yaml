# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: esengine
    repo_name: DeepSeek-Reasonix
    description: DeepSeek-native AI coding agent for your terminal. Engineered around prefix-cache stability — leave it running
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.38.0")
        no_asset: true
      - version_constraint: semver("<= 0.45.1")
        asset: Reasonix_{{trimV .Version}}_universal.{{.Format}}
        format: dmg
        windows_arm_emulation: true
        replacements:
          amd64: x64
        overrides:
          - goos: windows
            format: raw
            asset: Reasonix_{{trimV .Version}}_{{.Arch}}-setup
        supported_envs:
          - darwin
          - windows/amd64
      - version_constraint: Version == "desktop-v0.47.0"
