# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: hairyhenderson
    repo_name: gomplate
    description: A flexible commandline tool for template rendering. Supports lots of local and remote datasources
    supported_envs:
      - darwin
      - linux
      - amd64
    asset: gomplate_{{.OS}}-{{.Arch}}
    checksum:
      type: github_release
      asset: checksums-{{.Version}}_sha512.txt
      algorithm: sha512
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 5.3.0")
      - version_constraint: "true"
        github_artifact_attestations:
          signer_workflow: hairyhenderson/gomplate/.github/workflows/release-please.yml
