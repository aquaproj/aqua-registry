# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: elastic
    repo_name: crd-ref-docs
    description: Generates Kubernetes CRD API reference documentation
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.0.12")
        no_asset: true
      - version_constraint: "true"
        asset: crd-ref-docs_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
