# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    repo_owner: nodejs
    repo_name: node
    description: |
      Node.js JavaScript runtime

      ## How to set up

      Please see https://aquaproj.github.io/docs/reference/nodejs-support
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 24.10.0")
        url: https://nodejs.org/dist/{{.Version}}/node-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x64
          windows: win
        files:
          - name: corepack
            src: "{{.AssetWithoutExt}}/bin/corepack"
          - name: node
            src: "{{.AssetWithoutExt}}/bin/node"
          - name: npm
            src: "{{.AssetWithoutExt}}/bin/npm"
          - name: npx
            src: "{{.AssetWithoutExt}}/bin/npx"
        overrides:
          - goos: linux
            variants:
              - key: libc
                value: glibc
          - goos: linux
            variants:
              - key: libc
                value: musl
            type: http
            url: https://unofficial-builds.nodejs.org/download/release/{{.Version}}/node-{{.Version}}-linux-{{.Arch}}-musl.tar.gz
          - goos: windows
            format: zip
            files:
              - name: corepack
                src: "{{.AssetWithoutExt}}/corepack.cmd"
              - name: node
                src: "{{.AssetWithoutExt}}/node"
              - name: npm
                src: "{{.AssetWithoutExt}}/npm.cmd"
              - name: npx
                src: "{{.AssetWithoutExt}}/npx.cmd"
      - version_constraint: "true"
        url: https://nodejs.org/dist/{{.Version}}/node-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x64
          windows: win
        files:
          - name: node
            src: "{{.AssetWithoutExt}}/bin/node"
          - name: npm
            src: "{{.AssetWithoutExt}}/bin/npm"
          - name: npx
            src: "{{.AssetWithoutExt}}/bin/npx"
        overrides:
          - goos: linux
            variants:
              - key: libc
                value: glibc
          - goos: linux
            variants:
              - key: libc
                value: musl
            type: http
            url: https://unofficial-builds.nodejs.org/download/release/{{.Version}}/node-{{.Version}}-linux-{{.Arch}}-musl.tar.gz
          - goos: windows
            format: zip
            files:
              - name: node
                src: "{{.AssetWithoutExt}}/node"
              - name: npm
                src: "{{.AssetWithoutExt}}/npm.cmd"
              - name: npx
                src: "{{.AssetWithoutExt}}/npx.cmd"
