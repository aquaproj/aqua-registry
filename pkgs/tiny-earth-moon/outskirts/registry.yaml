# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: tiny-earth-moon
    repo_name: outskirts
    description: Find unused code at the outskirts of your Swift project. A community-maintained fork of Periphery 3.x
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("< 3.20.0")
        no_asset: true
      - version_constraint: "true"
        asset: outskirts-{{.Version}}-macos-arm64.tar.gz
        format: tar.gz
        files:
          - name: outskirts
            src: outskirts-{{.Version}}-macos-arm64/outskirts
        checksum:
          type: github_release
          asset: outskirts-{{.Version}}-macos-arm64.tar.gz.sha256
          algorithm: sha256
        supported_envs:
          - darwin/arm64
