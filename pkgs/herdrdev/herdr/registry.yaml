# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: herdrdev
    repo_name: herdr
    aliases:
      - name: ogulcancelik/herdr
    description: the runtime your coding agents live on
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.4.0"
        asset: herdr-{{.OS}}-{{.Arch}}
        format: raw
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: macos
        supported_envs:
          - darwin
      # Windows assets of preview releases are irregular, so they are excluded.
      - version_constraint: Version startsWith "preview-"
        asset: herdr-{{.OS}}-{{.Arch}}
        format: raw
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: macos
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.8.0")
        asset: herdr-{{.OS}}-{{.Arch}}
        format: raw
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: macos
        supported_envs:
          - linux
          - darwin
      - version_constraint: "true"
        asset: herdr-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: macos
        overrides:
          - goos: windows
            format: zip
            asset: herdr-{{.OS}}-{{.Arch}}.{{.Format}}
