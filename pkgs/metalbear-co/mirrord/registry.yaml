# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: metalbear-co
    repo_name: mirrord
    description: "Run any process, on your machine or in an AI agent's environment, as if it were a pod in your Kubernetes cluster: real env vars, DNS, network, traffic"
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version in ["2.4.0", "2.8.0", "2.9.0", "2.10.0", "3.0.0-alpha", "3.0.2-alpha", "3.0.18-alpha", "3.7.1", "3.10.1", "3.11.1", "3.14.2", "3.15.0", "3.19.0", "3.45.1", "3.95.1", "3.181.1"]
        no_asset: true
      - version_constraint: Version in ["2.8.1", "2.9.1"]
        asset: mirrord_{{.OS}}_{{.Arch}}
        format: raw
        replacements:
          darwin: mac
        overrides:
          - goos: linux
            replacements:
              amd64: x86_64
          - goos: darwin
            asset: mirrord_{{.OS}}_universal
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: Version in ["3.0.1-alpha", "3.0.17-alpha"]
        asset: mirrord_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        replacements:
          darwin: mac
        overrides:
          - goos: linux
            replacements:
              amd64: x86_64
          - goos: darwin
            asset: mirrord_{{.OS}}_universal.{{.Format}}
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: Version == "3.14.3"
        asset: mirrord_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        replacements:
          darwin: mac
        overrides:
          - goos: linux
            replacements:
              amd64: x86_64
              arm64: aarch64
          - goos: darwin
            asset: mirrord_{{.OS}}_universal.{{.Format}}
        supported_envs:
          - linux
          - darwin
      - version_constraint: Version in ["3.171.0", "3.172.0"]
        asset: mirrord_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        replacements:
          darwin: mac
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: linux
            replacements:
              amd64: x86_64
              arm64: aarch64
          - goos: darwin
            asset: mirrord_{{.OS}}_universal.{{.Format}}
          - goos: windows
            format: raw
            asset: mirrord
      - version_constraint: Version in ["v3.171.0", "v3.172.0"]
        asset: mirrord
        format: raw
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - windows/amd64
      - version_constraint: Version == "v3.174.0"
        asset: mirrord
        format: raw
        supported_envs:
          - windows/amd64
      - version_constraint: Version in ["3.177.0", "3.181.0"]
        asset: mirrord_{{.OS}}_universal.{{.Format}}
        format: zip
        replacements:
          darwin: mac
        overrides:
          - goos: linux
            asset: mirrord_{{.OS}}_{{.Arch}}.{{.Format}}
            replacements:
              amd64: x86_64
              arm64: aarch64
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 2.2.1")
        asset: mirrord_{{.OS}}_{{.Arch}}
        format: raw
        replacements:
          amd64: x86_64
          darwin: mac
        overrides:
          - goos: darwin
            replacements:
              arm64: aarch64
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 2.7.0")
        asset: mirrord_{{.OS}}_{{.Arch}}
        format: raw
        replacements:
          darwin: mac
        overrides:
          - goos: linux
            replacements:
              amd64: x86_64
          - goos: darwin
            asset: mirrord_{{.OS}}_universal
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 3.0.11-alpha")
        asset: mirrord_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        replacements:
          darwin: mac
        overrides:
          - goos: linux
            replacements:
              amd64: x86_64
          - goos: darwin
            asset: mirrord_{{.OS}}_universal.{{.Format}}
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 3.0.16-alpha")
        no_asset: true
      - version_constraint: semver("<= 3.4.0")
        asset: mirrord_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        replacements:
          darwin: mac
        overrides:
          - goos: linux
            replacements:
              amd64: x86_64
          - goos: darwin
            asset: mirrord_{{.OS}}_universal.{{.Format}}
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 3.5.2")
        no_asset: true
      - version_constraint: semver("<= 3.27.1")
        asset: mirrord_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        replacements:
          darwin: mac
        overrides:
          - goos: linux
            replacements:
              amd64: x86_64
              arm64: aarch64
          - goos: darwin
            asset: mirrord_{{.OS}}_universal.{{.Format}}
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 3.28.1")
        no_asset: true
      - version_constraint: semver("<= 3.170.0")
        asset: mirrord_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        replacements:
          darwin: mac
        overrides:
          - goos: linux
            replacements:
              amd64: x86_64
              arm64: aarch64
          - goos: darwin
            asset: mirrord_{{.OS}}_universal.{{.Format}}
        supported_envs:
          - linux
          - darwin
      - version_constraint: "true"
        asset: mirrord_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        replacements:
          darwin: mac
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: linux
            replacements:
              amd64: x86_64
              arm64: aarch64
          - goos: darwin
            asset: mirrord_{{.OS}}_universal.{{.Format}}
          - goos: windows
            format: raw
            asset: mirrord
