# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: home-operations
    repo_name: flate
    description: A Flux resource validator and inflator ⇄
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version in ["0.1.23", "v0.4.13"]
        no_asset: true
      - version_constraint: semver("<= 0.1.2")
        no_asset: true
      - version_constraint: semver("<= 0.2.12")
        asset: flate_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: windows
            format: zip
      - version_constraint: "true"
        asset: flate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: windows
            format: zip
