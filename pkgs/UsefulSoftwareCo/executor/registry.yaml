# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: UsefulSoftwareCo
    repo_name: executor
    description: The missing integration layer for AI agents. Let them call any OpenAPI / MCP / GraphQL / custom js functions in secure environment
    version_filter: Version != "graph-slices"
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.1.9")
        asset: executor-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x64
          windows: win
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            format: zip
      - version_constraint: semver("<= 1.3.0-beta.5")
      - version_constraint: "true"
        asset: executor-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
        replacements:
          amd64: x64
        overrides:
          - goos: linux
            format: tar.gz
            asset: executor-{{.OS}}-{{.Arch}}-musl.{{.Format}}
