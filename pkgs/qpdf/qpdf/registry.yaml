# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: qpdf
    repo_name: qpdf
    description: "qpdf: A content-preserving PDF document transformer"
    version_filter: Version startsWith "release-qpdf-" or Version matches "^v[0-9]"
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "release-qpdf-10.6.3.0cmake1"
        asset: qpdf-{{.SemVer}}-bin-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
        checksum:
          type: github_release
          asset: qpdf-{{.SemVer}}.sha256
          algorithm: sha256
        overrides:
          - goos: linux
            replacements:
              amd64: x86_64
          - goos: windows
            format: raw
            asset: qpdf-{{.SemVer}}-mingw32
        supported_envs:
          - linux/amd64
          - windows/amd64
      - version_constraint: Version == "release-qpdf-8.0.a1"
        checksum:
          type: github_release
          asset: qpdf-8.0.a1.md5
          algorithm: md5
      - version_constraint: Version == "release-qpdf-8.0.rc1"
        checksum:
          type: github_release
          asset: qpdf-8.0.rc1.md5
          algorithm: md5
      - version_constraint: Version == "release-qpdf-9.1.rc1"
        checksum:
          type: github_release
          asset: qpdf-9.1.rc1.md5
          algorithm: md5
      - version_constraint: semver("<= 8.0.2")
        checksum:
          type: github_release
          asset: qpdf-{{.SemVer}}.md5
          algorithm: md5
      - version_constraint: Version in ["release-qpdf-8.0.rc3", "release-qpdf-8.0.rc3"]
        checksum:
          type: github_release
          asset: qpdf-8.0.0.md5
          algorithm: md5
      - version_constraint: semver("<= 10.0.1")
        checksum:
          type: github_release
          asset: qpdf-{{.SemVer}}.md5
          algorithm: md5
      - version_constraint: semver("<= 10.6.3")
        asset: qpdf-{{.SemVer}}-bin-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
        replacements:
          amd64: x86_64
        checksum:
          type: github_release
          asset: qpdf-{{.SemVer}}.sha256
          algorithm: sha256
        supported_envs:
          - linux/amd64
      - version_constraint: semver("<= 12.2.0")
        asset: qpdf-{{trimV .Version}}-bin-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
        checksum:
          type: github_release
          asset: qpdf-{{trimV .Version}}.sha256
          algorithm: sha256
        overrides:
          - goos: linux
            replacements:
              amd64: x86_64
          - goos: windows
            format: raw
            asset: qpdf-{{trimV .Version}}-mingw32
        supported_envs:
          - linux/amd64
          - windows/amd64
      - version_constraint: "true"
        asset: qpdf-{{trimV .Version}}-bin-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
        checksum:
          type: github_release
          asset: qpdf-{{trimV .Version}}.sha256
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity-regexp
              - "^https://github\\.com/qpdf/qpdf/\\.github/workflows/.+\\.ya?ml@refs/tags/\\Q{{.Version}}\\E$"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
            bundle:
              type: github_release
              asset: qpdf-{{trimV .Version}}.sha256.sigstore
        overrides:
          - goos: linux
            replacements:
              amd64: x86_64
          - goos: windows
            format: raw
            asset: qpdf-{{trimV .Version}}-mingw32
        supported_envs:
          - linux/amd64
          - windows/amd64
