# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: timmo001
    repo_name: system-bridge
    description: A bridge for your systems
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version in ["v0.1.0", "v0.1.2", "4.1.6", "5.0.0-beta.1", "5.0.0-beta.13", "5.4.1"]
        no_asset: true
      - version_constraint: Version == "v0.1.1"
      - version_constraint: Version == "v2.6.0"
        asset: "{{.OS}}-out.{{.Format}}"
        format: tar.gz
        replacements:
          darwin: macos
        supported_envs:
          - darwin
          - windows/amd64
      - version_constraint: Version == "v2.7.2"
        asset: "{{.OS}}-out.{{.Format}}"
        format: tar.gz
        replacements:
          darwin: macos
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v2.7.3"
        asset: "{{.OS}}-out.{{.Format}}"
        format: tar.gz
        supported_envs:
          - windows/amd64
      - version_constraint: Version == "v2.7.4"
        asset: "{{.OS}}-out.{{.Format}}"
        format: tar.gz
        replacements:
          darwin: macos
        overrides:
          - goos: windows
            format: raw
            asset: system-bridge-setup
        supported_envs:
          - darwin
          - windows/amd64
      - version_constraint: Version == "v2.7.5"
        asset: "{{.OS}}-out.{{.Format}}"
        format: tar.gz
        replacements:
          darwin: macos
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v2.7.6"
        asset: "{{.OS}}-out.{{.Format}}"
        format: tar.gz
        supported_envs:
          - linux/amd64
          - windows/amd64
      - version_constraint: Version == "v2.7.7"
        asset: "{{.OS}}-out.{{.Format}}"
        format: tar.gz
        replacements:
          darwin: macos
        overrides:
          - goos: windows
            format: raw
            asset: system-bridge-setup
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v2.7.8"
        asset: "{{.OS}}-out.{{.Format}}"
        format: tar.gz
        replacements:
          darwin: macos
        supported_envs:
          - darwin
          - windows/amd64
      - version_constraint: Version == "4.1.5"
        asset: System.Bridge_{{.Version}}_{{.Arch}}-setup
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x64
        supported_envs:
          - windows/amd64
      - version_constraint: Version == "5.0.0-beta.5"
        asset: system-bridge-{{.Version}}-setup
        format: raw
        supported_envs:
          - windows/amd64
      - version_constraint: semver("<= 1.7.2")
        asset: system-bridge-{{.OS}}-{{.Arch}}-{{trimV .Version}}.{{.Format}}
        format: zip
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x64
          windows: win32
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 2.5.0")
        asset: "{{.OS}}-out.{{.Format}}"
        format: tar.gz
        replacements:
          darwin: macos
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 2.7.1")
        asset: "{{.OS}}-out.{{.Format}}"
        format: tar.gz
        replacements:
          darwin: macos
        overrides:
          - goos: windows
            format: raw
            asset: system-bridge-setup
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 2.8.4")
        asset: "{{.OS}}-out.{{.Format}}"
        format: tar.gz
        replacements:
          darwin: macos
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 3.7.0")
        no_asset: true
      - version_constraint: semver("<= 3.8.4")
        asset: "{{.OS}}-dist.{{.Format}}"
        format: zip
        supported_envs:
          - linux/amd64
          - windows/amd64
      - version_constraint: semver("<= 4.0.4")
        asset: systembridgesetup
        format: raw
        supported_envs:
          - windows/amd64
      - version_constraint: semver("<= 4.1.13")
        asset: System.Bridge_{{.Version}}_{{.Arch}}-setup
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x64
        supported_envs:
          - windows/amd64
      - version_constraint: semver("<= 5.0.0-beta.4")
        asset: system-bridge
        format: raw
        supported_envs:
          - windows/amd64
      - version_constraint: semver("<= 5.0.0-beta.7")
        no_asset: true
      - version_constraint: semver("<= 5.19.0")
        asset: system-bridge-{{.Version}}-setup
        format: raw
        supported_envs:
          - windows/amd64
      - version_constraint: "true"
        asset: system-bridge-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        overrides:
          - goos: linux
            format: tar.gz
        supported_envs:
          - linux/amd64
          - windows/amd64
