# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: palantir
    repo_name: policy-bot
    description: A GitHub App that enforces approval policies on pull requests
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.27.4")
        asset: policy-bot-{{trimV .Version}}.{{.Format}}
        format: tgz
        files:
          - name: policy-bot
            src: policy-bot-{{trimV .Version}}/bin/{{.OS}}-{{.Arch}}/policy-bot
        supported_envs:
          - linux/amd64
      - version_constraint: Version == "v1.38.1"
        no_asset: true
      - version_constraint: semver("<= 1.41.1")
        asset: policy-bot-{{trimV .Version}}.{{.Format}}
        format: tgz
        files:
          - name: policy-bot
            src: policy-bot-{{trimV .Version}}/bin/{{.OS}}-{{.Arch}}/policy-bot
        supported_envs:
          - linux
      - version_constraint: "true"
        asset: policy-bot-{{trimV .Version}}.{{.Format}}
        format: tgz
        files:
          - name: policy-bot
            src: policy-bot-{{trimV .Version}}/bin/{{.OS}}-{{.Arch}}/policy-bot
        supported_envs:
          - darwin
          - linux
