# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: goccy
    repo_name: tobari
    description: Tobari is a scoped coverage measurement tool for Go
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.12.0"
        no_asset: true
      - version_constraint: semver("<= 0.8.0")
        no_asset: true
      - version_constraint: "true"
        asset: tobari_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        github_artifact_attestations:
          signer_workflow: goccy/tobari/.github/workflows/release.yml
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            format: zip
