# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: charmbracelet
    repo_name: skate
    description: A personal key value store
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.3")
        asset: skate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          windows: Windows
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            format: zip
      - version_constraint: semver("<= 0.2.1")
        asset: skate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          windows: Windows
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://github.com/charmbracelet/skate/releases/download/{{.Version}}/checksums.txt.pem
              - --signature
              - https://github.com/charmbracelet/skate/releases/download/{{.Version}}/checksums.txt.sig
              - --certificate-github-workflow-repository
              - charmbracelet/skate
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
              - --certificate-identity
              - https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
        overrides:
          - goos: windows
            format: zip
      - version_constraint: Version == "v0.2.2"
        asset: skate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://github.com/charmbracelet/skate/releases/download/{{.Version}}/checksums.txt.pem
              - --signature
              - https://github.com/charmbracelet/skate/releases/download/{{.Version}}/checksums.txt.sig
              - --certificate-github-workflow-repository
              - charmbracelet/skate
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
              - --certificate-identity
              - https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
        overrides:
          - goos: windows
            format: zip
      - version_constraint: semver("< 1.1.0")
        asset: skate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: skate
            src: "{{.AssetWithoutExt}}/skate"
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://github.com/charmbracelet/skate/releases/download/{{.Version}}/checksums.txt.pem
              - --signature
              - https://github.com/charmbracelet/skate/releases/download/{{.Version}}/checksums.txt.sig
              - --certificate-github-workflow-repository
              - charmbracelet/skate
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
              - --certificate-identity
              - https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
        overrides:
          - goos: windows
            format: zip
      - version_constraint: "true"
        asset: skate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: skate
            src: "{{.AssetWithoutExt}}/skate"
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: github_release
              asset: checksums.txt.sigstore.json
            opts:
              - --certificate-github-workflow-repository
              - charmbracelet/skate
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
              - --certificate-identity
              - https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
        overrides:
          - goos: windows
            format: zip
