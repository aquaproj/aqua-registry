# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: rui314
    repo_name: mold
    description: "mold: A Modern Linker"
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.6.0-pre.1"
        no_asset: true
      - version_constraint: semver("<= 1.0.3")
        no_asset: true
      - version_constraint: semver("<= 2.40.2")
        asset: mold-{{trimV .Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
        files:
          - name: mold
            src: mold-{{trimV .Version}}-{{.Arch}}-{{.OS}}/bin/mold
          - name: ld.mold
            src: mold-{{trimV .Version}}-{{.Arch}}-{{.OS}}/bin/mold
          - name: ld64.mold
            src: mold-{{trimV .Version}}-{{.Arch}}-{{.OS}}/bin/mold
        supported_envs:
          - linux
      - version_constraint: "true"
        asset: mold-{{trimV .Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        files:
          - name: mold
            src: bin/mold
          - name: ld.mold
            src: bin/mold
          - name: ld64.mold
            src: bin/mold
        overrides:
          - goos: linux
            format: tar.gz
            replacements:
              arm64: aarch64
            files:
              - name: mold
                src: mold-{{trimV .Version}}-{{.Arch}}-{{.OS}}/bin/mold
              - name: ld.mold
                src: mold-{{trimV .Version}}-{{.Arch}}-{{.OS}}/bin/mold
              - name: ld64.mold
                src: mold-{{trimV .Version}}-{{.Arch}}-{{.OS}}/bin/mold
        supported_envs:
          - linux
          - windows/amd64
