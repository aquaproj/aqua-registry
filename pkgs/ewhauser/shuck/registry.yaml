# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ewhauser
    repo_name: shuck
    description: A lightning fast shell linter/formatter/LSP server with zsh support
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.0.25"
        no_asset: true
      - version_constraint: Version == "v0.0.0-test-files"
        no_asset: true
      - version_constraint: Version == "v0.0.13"
        asset: shuck-cli-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        windows_arm_emulation: true
        files:
          - name: shuck
            src: "{{.AssetWithoutExt}}/shuck"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: darwin
            replacements:
              amd64: amd64
              arm64: aarch64
          - goos: windows
            format: zip
            files:
              - name: shuck
        supported_envs:
          - linux/amd64
          - darwin/arm64
          - windows/amd64
      - version_constraint: semver("<= 0.0.10")
        asset: shuck-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        windows_arm_emulation: true
        files:
          - name: shuck
            src: "{{.AssetWithoutExt}}/shuck"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: darwin
            replacements:
              amd64: amd64
              arm64: aarch64
          - goos: windows
            format: zip
            files:
              - name: shuck
        supported_envs:
          - linux/amd64
          - darwin/arm64
          - windows/amd64
      - version_constraint: semver("<= 0.0.12")
        no_asset: true
      - version_constraint: "true"
        asset: shuck-cli-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        windows_arm_emulation: true
        files:
          - name: shuck
            src: "{{.AssetWithoutExt}}/shuck"
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: darwin
            replacements:
              amd64: amd64
          - goos: windows
            format: zip
            files:
              - name: shuck
        supported_envs:
          - linux
          - darwin/arm64
          - windows/amd64
