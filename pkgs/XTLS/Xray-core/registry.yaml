# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: XTLS
    repo_name: Xray-core
    description: Xray, Penetrates Everything. Also the best v2ray-core. Where the magic happens. An open platform for various uses
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.2.1")
        asset: Xray-{{.OS}}-64.{{.Format}}
        format: zip
        replacements:
          darwin: macos
        overrides:
          - goos: linux
            goarch: arm64
            asset: Xray-{{.OS}}-{{.Arch}}-v8a.{{.Format}}
          - goos: windows
            goarch: arm64
            asset: Xray-{{.OS}}-{{.Arch}}32-v7a.{{.Format}}
            replacements:
              arm64: arm
      - version_constraint: semver("<= 1.4.5")
        asset: Xray-{{.OS}}-64.{{.Format}}
        format: zip
        replacements:
          darwin: macos
        overrides:
          - goos: linux
            goarch: arm64
            asset: Xray-{{.OS}}-{{.Arch}}-v8a.{{.Format}}
          - goos: darwin
            goarch: arm64
            asset: Xray-{{.OS}}-{{.Arch}}-v8a.{{.Format}}
          - goos: windows
            goarch: arm64
            asset: Xray-{{.OS}}-{{.Arch}}32-v7a.{{.Format}}
            replacements:
              arm64: arm
      - version_constraint: "true"
        asset: Xray-{{.OS}}-64.{{.Format}}
        format: zip
        replacements:
          darwin: macos
        overrides:
          - goos: linux
            goarch: arm64
            asset: Xray-{{.OS}}-{{.Arch}}-v8a.{{.Format}}
          - goos: darwin
            goarch: arm64
            asset: Xray-{{.OS}}-{{.Arch}}-v8a.{{.Format}}
          - goos: windows
            goarch: arm64
            asset: Xray-{{.OS}}-{{.Arch}}-v8a.{{.Format}}
