# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: oras-project
    repo_name: oras
    asset: oras_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    description: ORAS CLI
    overrides:
      - goos: windows
        format: zip
    supported_envs:
      - darwin
      - linux
      - amd64
    checksum:
      type: github_release
      asset: oras_{{trimV .Version}}_checksums.txt
      algorithm: sha256
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.3.5")
      - version_constraint: "true"
        github_artifact_attestations:
          signer_workflow: oras-project/oras/.github/workflows/release-github.yml
