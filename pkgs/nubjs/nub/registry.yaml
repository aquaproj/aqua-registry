# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: nubjs
    repo_name: nub
    description: The fast all-in-one Node.js toolkit
    files:
      - name: nub
        src: bin/nub
      - name: nubx
        src: bin/nub
      - name: nubr
        src: bin/nub
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        asset: nub-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x64
          windows: win32
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: linux
            asset: nub-{{.OS}}-{{.Arch}}-musl.{{.Format}}
          - goos: windows
            format: zip
